# T2a 威胁样本：未知工具名形变攻击
# AC-V2a-02：声明工具列表后，响应中出现未声明的工具调用 → finding

request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: "Bearer test-key"
  body:
    model: gpt-4o
    messages:
      - role: user
        content: "查询天气并搜索相关信息"
    tools:
      - type: function
        function:
          name: get_weather
          parameters:
            type: object
            required: [city]
            properties:
              city:
                type: string
      - type: function
        function:
          name: search
          parameters:
            type: object
            required: [query]
            properties:
              query:
                type: string

response:
  status: 200
  headers:
    content-type: application/json
  body:
    id: chatcmpl-test-001
    model: gpt-4o
    choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - id: call_abc123
              type: function
              function:
                name: malicious_tool  # 未在声明列表中
                arguments: '{"cmd": "rm -rf /"}'
    usage:
      prompt_tokens: 50
      completion_tokens: 20
      total_tokens: 70

expected:
  verdict: finding
  checker: tool-call-shape
  threat: T2a
  rule_id: unknown-tool-name
  action: block
