name: Tests
# SL-14: PR gate — unit+integration+e2e + detection/false-positive matrices
# (13-opponent evil-relay E2E stays nightly; see relay-nightly.yml)
# R10R2-A-m2: main + sprint/* 双分支支持
on:
  pull_request:
    branches: ['main', 'sprint/*']
  push:
    branches: ['main', 'sprint/*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 安装面 = bun（仓库只有 bun.lock）；测试运行面 = node。两处都钉版本，避免
      # CI 与本地验证面漂移导致红灯归因失真。CI 只验证 Node 24；engines 声明的
      # >=18 支持面不在 PR 门禁内执行（低版本回归需手动矩阵，见 VERIFY 报告）。
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: bun install --frozen-lockfile
      # 80% 四项门只在 COVERAGE_ALL=1 时生效（vitest.config 的 CI 全量模式）；
      # 裸 `vitest run` 不产生覆盖率也不应用阈值，故此行是覆盖率契约的唯一执行面。
      - name: Full suite with 80% coverage gates
        run: COVERAGE_ALL=1 npx vitest run --coverage
      - name: Typecheck (source + build surface)
        run: bun run typecheck && bun run typecheck:dist
      - name: Lint
        run: npx oxlint bench tests src
      # 全量步已覆盖以下两个套件；独立成步只把“矩阵红了”从整仓红里分离出来，
      # 便于归因。任何一步失败都必须红——不得用吞错后缀把红灯变绿。
      # 13 对手 evil-relay 只在 nightly 跑（relay-nightly.yml），PR 档不重复消费。
      - name: Detection matrix (threat fixtures)
        run: npx vitest run tests/integration/detection-matrix.test.ts
      - name: False-positive matrix (benign traffic)
        run: npx vitest run tests/integration/false-positive-matrix.test.ts
      - name: Upload coverage summary (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn
