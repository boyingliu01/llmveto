name: test

# R10R2-A-m2 处置落地（2026-10-07）：全仓 test job。
# - 与 bench.yml 的守卫步互补：守卫步保持"单测 + 登记处面"的快反馈（显式文件列表，历史契约见其注释），
#   本 job 兜全量——tests/unit + tests/integration + tests/e2e + bench 一把跑，并首次把
#   80% 覆盖率四项门与双向 typecheck 装上 CI 执行面（此前只在本地显式跑才生效）。
# - integration/e2e 两面的 linux 首观测由本 job 的**首次运行**产生：推送 main 前先开 PR，
#   本 job 在 PR 上即触发（pull_request 支线），首跑红按四类口径归因（业务代码/测试数据/
#   规格/环境），属正常还债而非掩盖（PWR1-A-M2）。PWR2-C-m1 补口径：若红在 setup-bun/
#   bun install 步，coverage 产物缺失属**预期现象**（upload 步 if-no-files-found: warn），
#   归因直接记 ENVIRONMENT_ERROR，不需另查覆盖率面。
# - 覆盖面诚实申报：xp-gate 提交钩子 12+1 道门**不含覆盖率门**，80% 四项门仅在本 job
#   （及本地显式跑）强制 —— CI 是覆盖率契约的唯一执行面。
# - dist 相关用例（cli-smoke distSuite）在无 dist 的干净检出上按既有条件门自动 skip，不是掩盖。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        # 与本地验证面（bun 1.3.14）钉死同版本：`latest` 会让 CI 与本地跑过不同解释器，
        # 红灯归因失真、绿灯也不构成"同一执行面"证据（PWR1-A-M2）。
        with: { bun-version: "1.3.14" }
      - run: bun install --frozen-lockfile
      - name: Full suite with 80% coverage gates
        run: COVERAGE_ALL=1 bunx vitest run --coverage
      - name: Typecheck (source + build surface)
        run: bun run typecheck && bun run typecheck:dist
      - name: Lint
        run: bunx oxlint bench tests src
      - name: Upload coverage summary (audit trail)
        # always()：覆盖率红时摘要恰是归因证据，缺了它本 job 只能自证绿不能定位红。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn
