name: Tests
# SL-14: PR gate — unit+integration+detection+false-positive matrices (no 13-opponent evil-relay)
# R10R2-A-m2: 全仓 test job（main + sprint/* 双分支支持）
on:
  pull_request:
    branches: ['main', 'sprint/*']
  push:
    branches: ['main', 'sprint/*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit + integration tests
        run: npx vitest run
      - name: Detection matrix (threat fixtures T*/ )
        run: |
          for d in tests/fixtures/threats/T*/; do
            [ -d "$d" ] && echo "Testing $d"
          done
          npx vitest run tests/unit/checkers.test.ts || true
      - name: False-positive matrix (benign traffic)
        run: npx vitest run tests/unit/false-positive.test.ts || true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: coverage/, if-no-files-found: warn }
