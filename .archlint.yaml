# yaml-language-server: $schema=https://raw.githubusercontent.com/archlinter/archlint/main/resources/archlint.schema.json
ignore:
- '**/*.test.ts'
- '**/*.test.js'
- '**/*.test.tsx'
- '**/*.test.jsx'
- '**/*.spec.ts'
- '**/*.spec.js'
- '**/*.spec.tsx'
- '**/*.spec.jsx'
- '**/*.e2e-spec.ts'
- '**/*.e2e-spec.js'
- '**/__tests__/**'
- '**/__mocks__/**'
- '**/test/**'
- '**/tests/**'
- '**/__fixtures__/**'
- '**/*.mock.ts'
- '**/*.mock.js'
# bench/ 是基准探针与 case 表，唯一消费者是 *.test.ts（被上面规则忽略 → dead symbol 全是误报）
- 'bench/**'
# var/*.ts 是刻意 git 跟踪的 G-CANARY 录制工具（.gitignore !var/*.ts），独立脚本、不参与网关分层架构
- 'var/**'
# testkit/ 是测试替身（evil relay 等），唯一消费者是 *.test.ts（同样被上面规则忽略 → dead symbol 误报）
- 'testkit/**'
# scripts/*.mjs 是 package.json scripts 的入口（npm 调用），静态分析看不到这条调用边
overrides:
- files:
  - '**/scripts/**'
  rules:
    dead_code:
      enabled: false
