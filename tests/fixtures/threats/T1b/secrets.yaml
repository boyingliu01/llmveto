# @test REQ-VETO-012 T1b 正样本集
# v1 CI 断言：每条必须被 egress-secret-scan 检出 → verdict=finding
# ⚠️ 断言用值**必须**是非官方示例的假密钥：AWS 的 AKIAIOSFODNN7EXAMPLE 与 GitHub 的
#    ghp_ABCDEF…（连续字母）在 DOCUMENTED_EXAMPLE_VALUES 白名单内，会被放行（那是为了
#    避免"讨论凭据格式的会话被自己的网关拦下"）。用官方示例值做夹具，本矩阵会假红。
threat_id: T1b
checker: egress-secret-scan
cases:
  - id: t1b-openai
    body: 'please use this: sk-abcdefghijklmnopqrstuvwxyz1234 thanks'
    expected_rule_id: openai-sk
  - id: t1b-anthropic
    body: 'paste sk-ant-api03-AbCdEfGhIjKlMnOpQrStUvWx into config'
    expected_rule_id: anthropic-sk-ant
  - id: t1b-github
    body: 'ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX pushed'
    expected_rule_id: github-ghp
  - id: t1b-aws
    body: 'aws_access_key_id = AKIAXXXXXXXXXXXXXXXX'
    expected_rule_id: aws-akia
  - id: t1b-pem
    body: '-----BEGIN RSA PRIVATE KEY----- payload -----END RSA PRIVATE KEY-----'
    expected_rule_id: pem-private-key
