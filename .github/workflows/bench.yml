name: bench

# G-BENCH 性能三台门（REQ-VETO-013）
# - PR 与 main push：跑三台 runner（绝对门逐档打印），再由 check-regression 做相对回退判定
# - 相对门仅在基准与本次采样**同构环境（os/arch/ci 全等）且同口径（_repeats/_estimator 全等）**
#   时强制；跨环境/跨口径 → SKIP + 醒目提示（权威基准由 record job 在 ubuntu-latest 重录后人工提交，
#   见 docs/adr/0002 补遗一/补遗二）
# - 估计量：每档取 N=10 次独立运行的最小 **p50**（相对门判定量；干扰只会抬高成本 → 最小值最接近真成本），
#   record 与 check 双侧一致；补充打印中位、全部采样与 p95 对照供方差复核（补遗二：单次采样在共享 runner 上
#   受突发干扰支配，实测同 job 内同码同档可差 3×；重复取中位仍会按"快/慢模式"抽签而假红。补遗三：判定
#   分位数由 p95 改为 p50——尾部跨实例波动实测顶到 1.2× 容差本身，尾部回归只由绝对门在日志呈现）
# - 512KB 档 p99_scan >= G3 * 0.6 触发 ADR 提示

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {} # 触发 record job：重录权威基准

permissions:
  contents: read

jobs:
  bench:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      # 纯单测面（含 Minor 登记处完整性守卫，R7-B2；强制面由 R10R1-A-M1/C-M1 收口、R10R2-A-m2/B-2/C-m1
      # 扩面、R10R3-A-M1 定形为显式**文件**列表）：显式文件列表而非全量 vitest ——全量的
      # tests/integration + tests/e2e 未在本 workflow 环境验证过，在此引入会把一个纯守卫步变成不可控假红源。
      # 该对称缺口登记于 .sprint-state/bench-backlog.md（观测项）。
      # **为何不写裸目录名**（R10R3-A-M1，Major）：vitest 的位置参数是对测试文件路径的**子串过滤**、
      # 不前缀锚定，`bunx vitest run … bench` 会把任何路径含 `bench` 字样的文件（未来的
      # `tests/integration/bench-*.test.ts`、`tests/e2e/benchmark.test.ts` 等）静默纳入本阻断步，
      # 恰好重新引入上一段要避免的假红源。实测：放一个 `tests/integration/bench-sentinel.test.ts`，
      # 裸目录名形态 21 文件 / 显式文件列表形态 20 文件。`find` 的三个根目录因此是**作用域锚点**，
      # 交给 vitest 的一律是逐个真实文件路径；列表为空即 fail（绝不退化成全量）。
      # **锚点缺失必须 fail-loud，不能静默少跑**（R10R4-B-M1/A-m1/C-m2，Major）：`mapfile < <(find …)` 的
      # 进程替换**丢弃 find 的退出码**（`bash -e` 也管不到替换内部），所以某个锚点目录被重命名/拆分时 find
      # 只报 stderr、其余根照常产出 → 本步以**缩减后的文件集**转绿。方向是"假绿"，比上段那个"多纳入"的
      # 假红更隐蔽，且不写文件计数（计数随批次漂移，不得当命题——见 R10R3-A-m1）。故改为：先把列表落到
      # 临时文件、**直接**判 find/sort 的退出码，并对三个锚点逐一显式存在性断言（给出指名哪个锚点的定向
      # 文案，而不是裸 find stderr）。四路径实测记录见 docs/adr/0002 补遗一·验证节。
      # **`[ -d ]` 只证"目录在"，不证"目录里有货"**（R10R5-A-m1 + R10R5-B-m2，Minor）：上条的三条断言对
      # "目录存在但已被清空/剪掉全部 `*.test.ts`"同样放行，缩减仍是静默的 —— 同一失效方向、只堵了一半。
      # 补法取**零漂移**形态：每根再加一条"至少匹配 1 个文件"断言，而不是断言任何具体数目（断计数会随批次
      # 漂移，正是 R10R3-A-m1 禁止的那类命题）。`-print -quit` 让 find 在首个命中处即退出（不为存在性检查
      # 走完整棵树），管道出口取 `grep -q .` 的真/假，不打印内容。
      # 本条同时是一道**有意的绊线**：若将来某个根目录下的测试被**合法迁走**（例如 `tests/utils` 的
      # `*.test.ts` 并入 `tests/unit/utils/`），本步会红 —— 那是要求"在同一笔提交里把该根从锚点列表删掉"，
      # 而不是把断言放宽。锚点列表与真实布局脱节却不报错，正是本步要防的那类失效。
      # **`sort -z -o F F`（输入输出同文件）是同时性依赖**（R10R5-A-m2，Minor）：POSIX 对 `> F` 明确禁止
      # 同文件，`-o F F` 靠的是 GNU coreutils "先打开输出"的实现细节 —— 行为在版本间可变，真踩中就是静默
      # 截断列表（又一次"少跑而转绿"）。改为两个不同的 mktemp 文件，彻底消除该依赖。**如实披露**：本机
      # coreutils 实测 `-o F F` 与异文件形态**逐字节相同**（21 文件 / 750 字节，未复现损坏），故本条是
      # 预防性收口而非缺陷修复；判据是"不把正确性压在未承诺的实现细节上"。
      # 阻断性：本步非零退出即 bench job 红（早于三台 runner，失败信号最快、最便宜；本机实测墙钟 <2s，
      # 用例数随批次漂移故不写死）。
      - name: Unit + registry integrity guard
        run: |
          for root in tests/unit tests/utils bench; do
            if [ ! -d "$root" ]; then
              echo "guard step: scope root '$root' is missing — a renamed/split guard root must never narrow the run set" >&2
              exit 1
            fi
            if ! find "$root" -name '*.test.ts' -print -quit | grep -q .; then
              echo "guard step: scope root '$root' holds no *.test.ts — an emptied or pruned guard root must never narrow the run set" >&2
              exit 1
            fi
          done
          list_in="$(mktemp)"
          list_out="$(mktemp)"
          if ! find tests/unit tests/utils bench -name '*.test.ts' -print0 > "$list_in"; then
            echo "guard step: find over the three scope roots failed" >&2
            rm -f "$list_in" "$list_out"
            exit 1
          fi
          if ! sort -z "$list_in" -o "$list_out"; then
            echo "guard step: sort -z on the file list failed" >&2
            rm -f "$list_in" "$list_out"
            exit 1
          fi
          mapfile -d '' -t guard_files < "$list_out"
          rm -f "$list_in" "$list_out"
          if [ "${#guard_files[@]}" -eq 0 ]; then
            echo "guard step matched no test files; refusing to fall back to a full vitest run" >&2
            exit 1
          fi
          bunx vitest run "${guard_files[@]}"
      # 三台 runner 的独立步骤仅供人读（绝对门 print-only，ADR-0002 v2 决策）；除上方的单测守卫外，
      # 本 job 唯一的性能阻断步是 Regression check。`| tee` 已使退出码取末命令（`bash -e` 无 pipefail），此处再显式 `|| true`
      # 把"不阻断"写成契约 —— 避免将来有人加 pipefail/去 tee 时，把 print-only 变成真阻断
      # （补遗二决策 6）。代价：G3 runner 崩溃也不会在此步骤报红，兜底在 record job（runRunner throw）。
      - name: Run G1 TTFT
        run: bun run bench/g1-ttft.ts | tee bench-g1.log || true
      - name: Run G2 request gate
        run: bun run bench/g2-request-gate.ts | tee bench-g2.log || true
      - name: Run G3 checker timeout
        run: bun run bench/g3-checker-timeout.ts | tee bench-g3.log || true
      - name: Regression check vs baseline
        run: bun run bench/check-regression.ts
      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench-g*.log

  record:
    # 权威基线重录（workflow_dispatch 手动触发）：产出 artifact 供人工提交 bench/baseline.json。
    # 不引入 bot 直推 main 的写路径——main 的写权限与提交纪律保留在人工门（docs/adr/0002 补遗）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Record baseline (G1/G2/G3, warmup 50 + n=200, 10 runs → min)
        run: bun run bench:record
      - name: Show recorded baseline
        run: cat bench/baseline.json
      - name: Guard — frozen thresholds untouched
        run: git diff --exit-code bench/regression-formula.ts
      - name: Upload recorded baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench/baseline.json
