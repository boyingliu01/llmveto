# yaml-language-server: $schema=https://raw.githubusercontent.com/archlinter/archlint/main/resources/archlint.schema.json
ignore:
- '**/*.test.ts'
- '**/*.test.js'
- '**/*.test.tsx'
- '**/*.test.jsx'
- '**/*.spec.ts'
- '**/*.spec.js'
- '**/*.spec.tsx'
- '**/*.spec.jsx'
- '**/*.e2e-spec.ts'
- '**/*.e2e-spec.js'
- '**/__tests__/**'
- '**/__mocks__/**'
- '**/test/**'
- '**/tests/**'
- '**/__fixtures__/**'
- '**/*.mock.ts'
- '**/*.mock.js'
