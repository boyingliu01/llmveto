    source: docs/plans/2026-09-27-v2a-requirements.md
    acceptance_criteria: []
  - id: REQ-V2a-07
    title: （历史 REQ，定义见来源文档）
    source: docs/plans/2026-09-27-v2a-requirements.md
    acceptance_criteria: []
