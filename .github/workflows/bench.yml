name: bench

# G-BENCH 性能三台门（REQ-VETO-013）
# - PR 与 main push：跑三台 runner（绝对门逐档打印），再由 check-regression 做相对回退判定
# - 相对门仅在基准与本次采样**同构环境（os/arch/ci 全等）且同口径（_repeats/_estimator 全等）**
#   时强制；跨环境/跨口径 → SKIP + 醒目提示（权威基准由 record job 在 ubuntu-latest 重录后人工提交，
#   见 docs/adr/0002 补遗一/补遗二）
# - 估计量：每档取 N=10 次独立运行的最小 p95（干扰只会抬高成本 → 最小值最接近真成本），
#   record 与 check 双侧一致；补充打印中位与全部采样供方差复核（补遗二：单次采样在共享 runner 上
#   受突发干扰支配，实测同 job 内同码同档可差 3×；重复取中位仍会按"快/慢模式"抽签而假红）
# - 512KB 档 p99_scan >= G3 * 0.6 触发 ADR 提示

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {} # 触发 record job：重录权威基准

permissions:
  contents: read

jobs:
  bench:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      # 三台 runner 的独立步骤仅供人读（绝对门 print-only，ADR-0002 v2 决策）；本 job 唯一阻断步是
      # Regression check。`| tee` 已使退出码取末命令（`bash -e` 无 pipefail），此处再显式 `|| true`
      # 把"不阻断"写成契约 —— 避免将来有人加 pipefail/去 tee 时，把 print-only 变成真阻断
      # （补遗二决策 6）。代价：G3 runner 崩溃也不会在此步骤报红，兜底在 record job（runRunner throw）。
      - name: Run G1 TTFT
        run: bun run bench/g1-ttft.ts | tee bench-g1.log || true
      - name: Run G2 request gate
        run: bun run bench/g2-request-gate.ts | tee bench-g2.log || true
      - name: Run G3 checker timeout
        run: bun run bench/g3-checker-timeout.ts | tee bench-g3.log || true
      - name: Regression check vs baseline
        run: bun run bench/check-regression.ts
      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench-g*.log

  record:
    # 权威基线重录（workflow_dispatch 手动触发）：产出 artifact 供人工提交 bench/baseline.json。
    # 不引入 bot 直推 main 的写路径——main 的写权限与提交纪律保留在人工门（docs/adr/0002 补遗）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Record baseline (G1/G2/G3, warmup 50 + n=200, 10 runs → min)
        run: bun run bench:record
      - name: Show recorded baseline
        run: cat bench/baseline.json
      - name: Guard — frozen thresholds untouched
        run: git diff --exit-code bench/regression-formula.ts
      - name: Upload recorded baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench/baseline.json
